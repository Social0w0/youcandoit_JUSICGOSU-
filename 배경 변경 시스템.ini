배경 변경 시스템

상점 창 - 배경 섹션
여기서 기존 배경 이외의 추가 배경을 구매 가능!

기본 제공 색상 5개 이외에, 10개의 기본 색상 추가
(검정 / 보라 / 초록 / 노랑 / 빨강)
(파란색 / 하늘색 / 핑크 / 하양 / 주황 / 연두 / 연보라 / 연한 빨강 /연한 파랑)
개당 5만원

+++ 핵심 기능 !!!
플레이어 별 커스텀 배경

이미지를 서버 자체에 올림 ->
서버 데이터베이스에 저장된 이미지/이미지 링크

이후 로그인 시마다, 플레이어 각각에게 저장된 링크를 통해서 커스텀 배경에 이미지 삽입

이 커스텀 배경은 최대 3개까지 구매가능하며,
구매할 수록, 가격이 올라감.

// 초기 한정으로, 자산이 1경 이상인 플레이어는 (1000억 - 10조 - 1000조)
// 일반적인 적용 (100억 - 1000억 - 1조)


이후 profile-edit-view 부분에서 삽입된 이미지 수정 가능하도록 (최대 갯수만큼 구매한 이후에 해당 기능 활성화 가능)





